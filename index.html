<div class="win">

<script>
/* ===== 实盘版：所有分析数据来自 ./data.json，K 线来自 Binance PAXGUSDT（+basis） ===== */
const ST={filter:"过滤",pause:"暂停",exec:"执行"},CLS={filter:'s-filter',pause:'s-pause',exec:'s-exec'};
const TFS=["1m","5m","15m","30m","1H","4H"],IVMAP={"1m":"1m","5m":"5m","15m":"15m","30m":"30m","1H":"1h","4H":"4h"};
const ORDER6=["4H","1H","30m","15m","5m","3m"];
let DATA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 时钟（装饰） */
setInterval(()=>{$('clock').textContent='hw:xau / '+new Date().toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Kuala_Lumpur'})},1000);

/* 左上角星星：眼睛转动 + 眨眼 + 思考字（装饰动画） */
const eyesBox=$('eyes'),eyes=[...document.querySelectorAll('.eye')],think=$('think');
const THINK=["观察中…","思考中…","比对周期…","等待信号…"];
let look=0;setInterval(()=>{look=(look+1)%4;const dx=[-2.5,2.5,0,1.5][look],dy=[0,0,-2,2][look];eyesBox.style.transform=`rotate(-14deg) translate(${dx}px,${dy}px)`},800);
(function blink(){eyes.forEach(e=>e.classList.add('blink'));setTimeout(()=>eyes.forEach(e=>e.classList.remove('blink')),140);setTimeout(blink,2200+Math.random()*2500)})();
setInterval(()=>think.textContent=THINK[Math.floor(Math.random()*THINK.length)],2600);

/* 小机器人造型 */
const BOTS={"4H":{c:"#a78bfa",sh:'<rect x="8" y="10" width="84" height="80" rx="22"/>'},
  "1H":{c:"#60a5fa",sh:'<circle cx="50" cy="52" r="44"/>'},
  "30m":{c:"#22d3ee",sh:'<polygon points="50,4 92,27 92,75 50,98 8,75 8,27" stroke-linejoin="round" stroke-width="8"/>'},
  "15m":{c:"#34d399",sh:'<path d="M50 6C82 6 96 40 96 62C96 86 76 96 50 96C24 96 4 86 4 62C4 40 18 6 50 6Z"/>'},
  "5m":{c:"#f472b6",sh:'<rect x="6" y="24" width="88" height="66" rx="30"/><line x1="50" y1="24" x2="50" y2="8" stroke-width="5"/><circle cx="50" cy="7" r="7"/>'},
  "3m":{c:"#facc15",sh:'<rect x="18" y="18" width="64" height="64" rx="16" transform="rotate(45 50 50)"/>'},
  "1m":{c:"#e8590c",sh:'<path d="M50 4C64 4 63 27 75 31C88 35 97 38 97 50C97 63 88 65 75 69C63 73 64 96 50 96C36 96 37 73 25 69C12 65 3 63 3 50C3 38 12 35 25 31C37 27 36 4 50 4Z"/>',cmd:true}};
function botHTML(tf){const b=BOTS[tf];if(!b)return'';const eye='<div class="beye"><div class="bp"></div></div>';
  return `<div class="bot ${b.cmd?'cmd':''}"><svg viewBox="0 0 100 100" fill="${b.c}" stroke="${b.c}">${b.sh}</svg><div class="be">${eye}${eye}</div><div class="bub"><i>.</i><i>.</i><i>.</i></div></div>`}
function nodeHTML(tf,rank,cls){return `<div class="node s-filter ${cls||''}" data-k="${tf}">${cls&&cls.includes('final')?'':botHTML(tf)}${rank?`<div class="rank">${rank}</div>`:''}<div class="n">${tf}</div><div class="d">--</div><span class="pill">--</span></div>`}

/* 搭架构（固定结构，状态由 data.json 填） */
const orgTop=$('orgTop'),orgRow=$('orgRow'),tfc=$('tfc');
ORDER6.forEach(tf=>orgRow.insertAdjacentHTML('beforeend',nodeHTML(tf,'顶级分析师')));
orgTop.insertAdjacentHTML('beforeend',nodeHTML('1m','总指挥','big')+'<div class="arrow"></div>'+nodeHTML('执行','','big final'));
ORDER6.forEach(tf=>tfc.insertAdjacentHTML('beforeend',`<div class="card s-filter" data-tf="${tf}"><div class="hd">${botHTML(tf)}<b>${tf}</b><span class="pill">--</span></div>
  <div class="kv"><span>趋势 ZL</span><em>--</em></div><div class="kv"><span>RF 方向</span><em>--</em></div><div class="kv"><span>zlema</span><em>--</em></div>
  <div class="kv"><span>RF filt</span><em>--</em></div><div class="kv"><span>Momentum</span><em>--</em></div><div class="kv"><span>结构</span><em>--</em></div></div>`));
const nodeEl=k=>document.querySelector(`.org .node[data-k="${k}"]`);
/* 小机器人：各自转眼珠、各自眨眼（装饰） */
document.querySelectorAll('.bot').forEach((b,k)=>{b.style.animationDelay=(k*.35)+'s';const ps=b.querySelectorAll('.bp'),es=b.querySelectorAll('.beye');
  setInterval(()=>{const dx=(Math.random()-.5)*5,dy=(Math.random()-.5)*4;ps.forEach(p=>p.style.transform=`translate(${dx}px,${dy}px)`)},700+k*130);
  (function bl(){es.forEach(e=>e.classList.add('blink'));setTimeout(()=>es.forEach(e=>e.classList.remove('blink')),140);setTimeout(bl,1800+Math.random()*3500)})()});
const cmdBub=document.querySelector('.bot.cmd .bub');

function setNode(el,s,desc,extra){const prev=el.dataset.s;el.className='node '+CLS[s]+' '+(extra||'');el.dataset.s=s;el.querySelector('.pill').textContent=ST[s];
  if(desc!=null)el.querySelector('.d').textContent=desc;if(prev&&prev!==s){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),600)}}

/* 提示音：只在 1m 或 执行 状态真实变化时响；默认开启 */
let soundOn=true,actx=null;const sndBtn=$('snd');
sndBtn.onclick=e=>{e.stopPropagation();soundOn=!soundOn;sndBtn.textContent=soundOn?'🔊 提示音 开':'🔇 已静音';sndBtn.classList.toggle('off',!soundOn);if(soundOn)unlock()};
function unlock(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});
const TONE={exec:880,pause:620,filter:420};
function beep(s){if(!soundOn||!actx||actx.state!=='running')return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=TONE[s];
  g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.18);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.2)}

/* ===== 渲染 data.json ===== */
const LC={res:'#ff4d6d',sup:'#21f39a',inv:'#ff9f1c'};
const col=t=>/^(多|偏多|强|好|高|是)/.test(t)?'c-g':/^(空|偏空|弱|差|低|否)/.test(t)?'c-r':'c-o';
let last1m=null,lastExec=null;
function render(d){
  DATA=d;
  const r=d.regime||{};const rg=$('regime');rg.textContent=`区间 ${(+r.low).toFixed(1)}-${(+r.high).toFixed(1)} / 趋势 ${r.trend||'--'}`;
  rg.className=(r.trend||'').includes('空')?'bear':(r.trend||'').includes('多')?'':'range';
  $('upd').textContent=`更新时间 ${(d.updated||'').slice(11,16)} (UTC+8) · ${d.updated?d.updated.slice(0,10):''} · OANDA ${(+d.price).toFixed(1)}`;
  (d.analysts||[]).forEach(a=>{const el=document.querySelector(`.org .row .node[data-k="${a.tf}"]`);if(el)setNode(el,a.status,a.desc);
    const c=tfc.querySelector(`[data-tf="${a.tf}"]`);if(c){c.className='card '+CLS[a.status];c.querySelector('.pill').textContent=ST[a.status]}});
  ORDER6.forEach(tf=>{const t=(d.tfInfo||{})[tf],c=tfc.querySelector(`[data-tf="${tf}"]`);if(!t||!c)return;const em=c.querySelectorAll('em');
    const vals=[[t.trend,t.trend==='多'?'c-g':'c-r'],[t.rf,t.rf==='多'?'c-g':'c-r'],[(+t.zlema).toFixed(1),''],[(+t.filt).toFixed(1),''],[t.ms,String(t.ms).startsWith('-')?'c-r':'c-g'],[t.zz,'']];
    vals.forEach(([v,k],i)=>{em[i].textContent=v;em[i].className=k})});
  const cm=d.commander||{status:'filter'},ex=d.exec||{status:'filter'};
  setNode(nodeEl('1m'),cm.status,cm.desc,'big');setNode(nodeEl('执行'),ex.status,ex.desc,'big final');
  cmdBub.innerHTML=cm.status==='exec'?'<b>执行!</b>':cm.status==='pause'?'<i>.</i><i>.</i><i>.</i>':'<i>z</i>';
  if((last1m!==null&&last1m!==cm.status)||(lastExec!==null&&lastExec!==ex.status))beep(ex.status!==lastExec?ex.status:cm.status);
  last1m=cm.status;lastExec=ex.status;
  const v=d.verdict||{};$('verdict').innerHTML=[["大方向",v.dir],["共振强度",v.strength],["回调质量",v.quality],["是否提醒1m进场",v.entry]]
    .map(([k,val])=>`<div><small>${k}</small><b class="${col(val||'')}">${esc(val||'--')}</b></div>`).join('');
  const A=d.advice||{};$('advice').innerHTML=['操作建议','失效条件','风险提示'].map(k=>`<div><small>${k}</small><span>${esc(A[k]||'--')}</span></div>`).join('');
  $('lv').innerHTML=(d.levels||[]).map(l=>`<span style="color:${LC[l.type]};border-color:${LC[l.type]}55">${esc(l.name)} ${(+l.p).toFixed(1)}</span>`).join('');
  if(src==='fallback'&&!raw.length&&d.fallback)raw=d.fallback.bars.slice(-NB);
  checkStale();drawK();
}
function checkStale(){const el=$('stale');if(!DATA){el.className='stale on';el.textContent='⚠ 读取 data.json 失败，正在重试…';return}
  const m=Math.floor((Date.now()/1000-(DATA.updated_ts||0))/60);
  if(m>30){el.className='stale on';el.textContent=`⚠ 数据已过期：上次分析是 ${m>=60?Math.floor(m/60)+' 小时 ':''}${m%60} 分钟前（${DATA.updated} UTC+8），结论可能已不适用。`}else el.className='stale'}
async function loadData(){try{const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;render(await r.json())}catch(e){checkStale()}}
loadData();setInterval(loadData,60000);setInterval(checkStale,30000);

/* ===== 实时 K 线 ===== */
function fit(c){const r=window.devicePixelRatio||1;if(!c._h)c._h=c.height;const w=c.clientWidth,h=c._h;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);return [x,w,h]}
let curTf="1m",raw=[],ws=null,src='',reqId=0;const NB=90;
const basis=()=>+(DATA&&DATA.basis)||0;
function bars(){if(src==='fallback')return raw.map(b=>[b[1],b[2],b[3],b[4],b[0]]);const B=basis();return raw.map(b=>[b[1]+B,b[2]+B,b[3]+B,b[4]+B,b[0]])}
async function loadK(tf){const id=++reqId;if(ws){ws.onclose=null;ws.close();ws=null}const iv=IVMAP[tf];
  $('ksrc').textContent='加载中…';
  for(const host of ['https://api.binance.com','https://data-api.binance.vision']){
    try{const r=await fetch(`${host}/api/v3/klines?symbol=PAXGUSDT&interval=${iv}&limit=${NB}`);if(!r.ok)throw 0;const a=await r.json();if(id!==reqId)return;
      raw=a.map(k=>[k[0]/1000,+k[1],+k[2],+k[3],+k[4]]);src='binance';drawK();openWs(iv,id);return}catch(e){}}
  if(id!==reqId)return;
  const fb=DATA&&DATA.fallback;raw=fb?fb.bars.slice(-NB):[];src='fallback';drawK()}
function openWs(iv,id){try{ws=new WebSocket(`wss://stream.binance.com:9443/ws/paxgusdt@kline_${iv}`);
  ws.onmessage=e=>{if(id!==reqId)return;const k=JSON.parse(e.data).k,b=[k.t/1000,+k.o,+k.h,+k.l,+k.c];
    if(raw.length&&raw[raw.length-1][0]===b[0])raw[raw.length-1]=b;else if(!raw.length||b[0]>raw[raw.length-1][0]){raw.push(b);if(raw.length>NB)raw.shift()}drawK()};
  ws.onclose=()=>{if(id===reqId)setTimeout(()=>{if(id===reqId)openWs(iv,id)},3000)}}catch(e){}}
function drawK(){const c=$('kc');const [x,w,h]=fit(c);const pad=64;const k=bars();
  const ks=$('ksrc');ks.textContent=src==='binance'?`实时 · PAXG/USDT ${basis()>=0?'+':''}${basis().toFixed(2)} 价差校正`:src==='fallback'?`⚠ 实时行情加载失败，显示分析时的 OANDA 1m K 线（${(DATA&&DATA.fallback&&DATA.fallback.note)||''}）`:'加载中…';
  if(!k.length){x.fillStyle='#6b7a90';x.font='14px sans-serif';x.fillText('K 线加载中…',20,40);return}
  const levels=(DATA&&DATA.levels)||[];
  let hi=Math.max(...k.map(a=>a[1])),lo=Math.min(...k.map(a=>a[2]));
  const span=Math.max(hi-lo,1);const vis=levels.filter(l=>l.p<=hi+span*.6&&l.p>=lo-span*.6),out=levels.filter(l=>!vis.includes(l));vis.forEach(l=>{hi=Math.max(hi,l.p);lo=Math.min(lo,l.p)});
  const m=(hi-lo)*.05;hi+=m;lo-=m;const py=v=>(hi-v)/(hi-lo)*h,cw=(w-pad)/k.length;
  x.strokeStyle='#141b28';x.lineWidth=1;for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,h*i/5);x.lineTo(w-pad,h*i/5);x.stroke()}
  // 时间刻度
  x.font='10px Menlo,monospace';x.fillStyle='#4b5a70';x.textAlign='center';const step=Math.ceil(k.length/6);
  k.forEach((a,i)=>{if(i%step===0){x.fillText(new Date(a[4]*1000).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kuala_Lumpur'}),i*cw+cw/2,h-4)}});
  // 价位线
  x.font='10.5px Menlo,monospace';x.textAlign='left';
  const nameY=[],tagY=[];
  [...vis].sort((a,b)=>b.p-a.p).forEach(l=>{const y=py(l.p);x.strokeStyle=LC[l.type];x.globalAlpha=.85;x.setLineDash(l.type==='inv'?[]:[5,4]);x.lineWidth=l.type==='inv'?1.6:1;
    x.beginPath();x.moveTo(0,y);x.lineTo(w-pad,y);x.stroke();x.setLineDash([]);x.globalAlpha=1;
    // 名称：和上面的标签太近就往右错开
    const near=nameY.filter(v=>Math.abs(v-y)<12).length;nameY.push(y);const nx=4+near*150;
    x.fillStyle='rgba(7,9,15,.7)';const nw=x.measureText(l.name).width;x.fillRect(nx-2,y-13,nw+4,12);x.fillStyle=LC[l.type];x.fillText(l.name,nx,y-3);
    // 右侧价签：往下堆叠，不重叠
    let ty=y;tagY.forEach(v=>{if(Math.abs(v-ty)<16)ty=v+16});tagY.push(ty);
    x.fillRect(w-pad+2,ty-8,pad-4,16);x.fillStyle='#07090f';x.fillText((+l.p).toFixed(1),w-pad+6,ty+4)});
  // K 线
  x.lineWidth=1;k.forEach(([o,H,L,C],i)=>{const cl=C>=o?'#21f39a':'#ff4d6d',cx=i*cw+cw/2;x.strokeStyle=x.fillStyle=cl;
    x.beginPath();x.moveTo(cx,py(H));x.lineTo(cx,py(L));x.stroke();x.fillRect(cx-cw*.32,Math.min(py(o),py(C)),cw*.64,Math.max(1,Math.abs(py(o)-py(C))))});
  // 超出视野的关键价位：贴在顶部/底部，带箭头
  let ua=0,da=0;x.textAlign='left';out.forEach(l=>{const up=l.p>hi,y=up?14+ua++*18:h-22-da++*18;const t=(up?'↑ ':'↓ ')+l.name+' '+(+l.p).toFixed(1);
    const tw=x.measureText(t).width+10;x.fillStyle='rgba(7,9,15,.85)';x.fillRect(w-pad-tw-4,y-11,tw,15);x.strokeStyle=LC[l.type];x.setLineDash(l.type==='inv'?[]:[3,2]);x.strokeRect(w-pad-tw-4,y-11,tw,15);x.setLineDash([]);
    x.fillStyle=LC[l.type];x.fillText(t,w-pad-tw+1,y)});
  // 最新价
  const lastP=k[k.length-1][3],y=py(lastP);x.strokeStyle='#22d3ee';x.setLineDash([2,3]);x.beginPath();x.moveTo(0,y);x.lineTo(w-pad,y);x.stroke();x.setLineDash([]);
  x.fillStyle='#22d3ee';x.fillRect(w-pad+2,y-8,pad-4,16);x.fillStyle='#07090f';x.fillText(lastP.toFixed(1),w-pad+6,y+4)}
const tfBox=$('tfs');
TFS.forEach(tf=>{const b=document.createElement('button');b.textContent=tf;if(tf===curTf)b.className='on';
  b.onclick=()=>{curTf=tf;$('tfName').textContent=tf;[...tfBox.children].forEach(e=>e.className=e===b?'on':'');loadK(tf)};tfBox.appendChild(b)});
loadK(curTf);addEventListener('resize',drawK);

</script>
